<svg xmlns="http://www.w3.org/2000/svg"
     width="200"
     height="200"
     viewBox="0 0 200 200"
     role="img"
     aria-label="Blue circle drawing animation from 12 o'clock to 12 o'clock">
  <circle
    cx="100"
    cy="100"
    r="70"
    fill="none"
    stroke="#0066FF"
    stroke-width="12"
    stroke-linecap="round"
    pathLength="100"
    stroke-dasharray="100"
    stroke-dashoffset="100"
    transform="rotate(-90 100 100)">
    <animate
      attributeName="stroke-dashoffset"
      from="100"
      to="0"
      dur="0.333s"
      begin="0s"
      repeatCount="1"
      fill="freeze"
      calcMode="spline"
      keyTimes="0;1"
      keySplines="0.42 0 1 1" />
  </circle>
</svg>
