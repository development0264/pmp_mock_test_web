<!DOCTYPE html>

    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

  <base href="/pmp_mock_test_web/">
  <title>PMP Exam Prep</title>
  <meta charset="UTF-8">
  <script type="text/javascript">
    // Restore deep-link URL after GitHub Pages 404 redirect.
    // https://github.com/rafgraph/spa-github-pages
    (function (location) {
      if (location.search[1] === '/') {
        var decoded = location.search.slice(1).split('&').map(function (segment) {
          return segment.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(
          null,
          null,
          location.pathname.slice(0, -1) + decoded + location.hash
        );
      }
    }(window.location));
  </script>
