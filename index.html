  <script type="text/javascript">
    // Restore deep-link URL after GitHub Pages 404 redirect.
    // https://github.com/rafgraph/spa-github-pages
    (function (location) {
      if (location.search[1] === '/') {
        var decoded = location.search.slice(1).split('&').map(function (segment) {
          return segment.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(
          null,
          null,
          location.pathname.slice(0, -1) + decoded + location.hash
        );
      }
    }(window.location));
  </script>

  <script>
    (function() {
      function patch() {
        if (typeof Cropper === 'undefined') return false;
        if (window.__cropperPatched) return true;
        window.__cropperPatched = true;

        if (Cropper.setDefaults) {
          Cropper.setDefaults({ responsive: false, restore: false });
        }

        var origBind = Cropper.prototype.bind;
        Cropper.prototype.bind = function() {
          if (this.element) {
            this.element.cropper = this;
            if (this.element.parentElement) {
              this.element.parentElement.cropper = this;
            }
          }
          this.options.responsive = false;
          return origBind.apply(this, arguments);
        };

        var origResize = Cropper.prototype.resize;
        Cropper.prototype.resize = function() {
          var c = this.container;
          if (!c || c.offsetWidth < 50 || c.offsetHeight < 50) {
            return;
          }
          return origResize.apply(this, arguments);
        };

        var _cropperResizeTimer;
        window.addEventListener('resize', function() {
          clearTimeout(_cropperResizeTimer);
          _cropperResizeTimer = setTimeout(function() {
            var views = document.querySelectorAll('[id^="cropperView_"]');
            views.forEach(function(view) {
              var img = view.querySelector('img');
              var instance = (img && img.cropper) || view.cropper;
              if (instance && view.offsetWidth >= 50 && view.offsetHeight >= 50) {
                instance.resize();
              }
            });
          }, 250);
        });

        return true;
      }

      if (!patch()) {
        var checkInterval = setInterval(function() {
          if (patch()) clearInterval(checkInterval);
        }, 50);
        setTimeout(function() { clearInterval(checkInterval); }, 5000);
      }
    })();
  </script>
